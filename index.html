<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}


body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#000;

    color:white;

}



/* CONTAINER */

.phone{

    width:390px;

    height:844px;

    padding:35px 25px;

    display:flex;

    flex-direction:column;

}



/* LOGO */


.logo{

    margin-top:100px;

    margin-bottom:75px;

    display:flex;

    justify-content:center;

}



.logo .circle{


    width:100px;

    height:100px;


    border-radius:30px;


    background:
    linear-gradient(135deg,
    #feda75,
    #fa7e1e,
    #d62976,
    #962fbf,
    #4f5bd5);


    display:flex;

    justify-content:center;

    align-items:center;


    position:relative;


    box-shadow:
    0 0 30px rgba(214,41,118,.45);


}



.logo .circle::before{


    content:"";


    width:50px;

    height:50px;


    border:5px solid white;


    border-radius:16px;


    position:absolute;


}



.logo .circle::after{


    content:"";


    width:12px;

    height:12px;


    background:white;


    border-radius:50%;


    position:absolute;


    top:25px;

    right:25px;


}





/* FORM */


.form{

    display:flex;

    flex-direction:column;

    gap:16px;

}





input{


    height:58px;


    border-radius:14px;


    border:1px solid #333;


    background:#111;


    color:white;


    padding:0 18px;


    font-size:16px;


    outline:none;


}



input::placeholder{

    color:#888;

}




input:focus{


    border-color:#555;


}





/* BOTÃO ENTRAR */


button{


    height:58px;


    border:none;


    font-size:18px;


    font-weight:600;


    cursor:pointer;


    transition:.3s;


}



.login{


    height:52px;


    border-radius:28px;


    background:#0095f6;


    color:white;


    margin-top:5px;


    box-shadow:

    0 5px 15px rgba(0,149,246,.25);


}



.login:hover{


    background:#007ed1;

    transform:translateY(-2px);

}




/* ERRO */


.erro{


    display:none;


    background:#250000;


    border:1px solid #8b0000;


    color:#ff6b6b;


    border-radius:10px;


    padding:12px;


    text-align:center;


    font-size:14px;


}





/* ESQUECEU */


.forgot{


    margin-top:25px;


    text-align:center;


    color:#4da3ff;


    text-decoration:none;


    font-size:15px;


}





/* PARTE FINAL */


.bottom{


    margin-top:auto;


    display:flex;

    flex-direction:column;

    gap:25px;


}





.create{


    height:52px;


    border-radius:28px;


    background:transparent;


    border:1px solid #0095f6;


    color:#0095f6;


}



.create:hover{


    background:#001a2b;


}




.meta{


    text-align:center;


    font-size:22px;


    color:#777;


    font-weight:400;


}





</style>


</head>



<body>



<div class="phone">



<div class="logo">


<div class="circle"></div>


</div>





<div class="form">



<input

type="text"

placeholder="Usuário, email ou telefone">





<input

type="password"

placeholder="Senha">





<button class="login">

Entrar

</button>





<div class="erro" id="erroSenha">

Senha incorreta. Verifique sua senha e tente novamente.

</div>





<a href="#" class="forgot">

Esqueceu sua senha?

</a>




</div>







<div class="bottom">



<button class="create">

Criar nova conta

</button>





<div class="meta">

∞ Meta

</div>



</div>





</div>






<script>


const botao = document.querySelector(".login");

const erro = document.getElementById("erroSenha");



botao.addEventListener("click",()=>{


erro.style.display="block";


});



</script>



</body>

</html>
