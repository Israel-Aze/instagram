<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
radial-gradient(circle at top left,#fff7f3 0%,transparent 35%),
radial-gradient(circle at bottom right,#f3fff7 0%,transparent 35%),
linear-gradient(135deg,#fafafa,#edf6ff);

}

.phone{

width:390px;
height:844px;

background:transparent;

display:flex;
flex-direction:column;

padding:35px 25px;

position:relative;

}

.logo{

margin-top:110px;
margin-bottom:90px;

display:flex;
justify-content:center;

}

.logo .circle{

width:90px;
height:90px;

border-radius:25px;

background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);

display:flex;
justify-content:center;
align-items:center;

}

.logo .circle::before{

content:"";

width:46px;
height:46px;

border:6px solid white;

border-radius:50%;

}

.form{

display:flex;
flex-direction:column;
gap:18px;

}

input{

height:60px;

border:1px solid #d6d6d6;

border-radius:18px;

padding:0 22px;

font-size:18px;

background:white;

outline:none;

}

input:focus{

border-color:#0A66FF;

}

button{

height:60px;

border:none;

border-radius:30px;

font-size:20px;

font-weight:600;

cursor:pointer;

}

.login{

background:#0A66FF;

color:white;

}

.login:hover{

background:#005be5;

}

.forgot{

margin-top:30px;

text-align:center;

font-size:18px;

text-decoration:none;

color:#1c1c1c;

}

.bottom{

margin-top:auto;

display:flex;

flex-direction:column;

gap:25px;

}

.create{

background:white;

border:2px solid #0A66FF;

color:#0A66FF;

}

.create:hover{

background:#f2f8ff;

}

.meta{

text-align:center;

font-size:34px;

font-weight:300;

color:#555;

letter-spacing:-1px;

}

</style>

</head>

<body>

<div class="phone">

<div class="logo">
<div class="circle"></div>
</div>

<div class="form">

<input
type="text"
placeholder="Username, email or mobile number">

<input
type="password"
placeholder="Password">

<button class="login">
Log in
</button>

<a href="#" class="forgot">
Forgot password?
</a>

</div>

<div class="bottom">

<button class="create">
Create new account
</button>

<div class="meta">
∞ Meta
</div>

</div>

</div>

</body>
</html>
