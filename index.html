<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Site</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
}


/* Caixa principal */
.login-box {
    width: 350px;
    padding: 40px;
    background: #111;
    border-radius: 15px;
    box-shadow: 0 0 30px #000;
    text-align: center;
}


/* Título */
.login-box h1 {
    color: white;
    margin-bottom: 30px;
}


/* Campos */
.login-box input {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    background: #222;
    border: none;
    outline: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
}


/* Botão */
button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: white;
    color: black;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #777;
    color: white;
}


/* Texto inferior */
p {
    color: gray;
    margin-top: 20px;
}
</style>

</head>

<body>

<div class="login-box">

<h1>Login</h1>

<input type="text" placeholder="Usuário">

<input type="password" placeholder="Senha">

<button>Entrar</button>

<p>Meu site © 2026</p>

</div>


</body>
</html>
