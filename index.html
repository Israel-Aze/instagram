<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


body{

    background:#000;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;

}


/* área principal */

.container{

    width:365px;
    text-align:center;

    margin-top:-80px;

}


/* Logo */

.logo{

    font-size:52px;

    font-family:cursive;

    font-weight:bold;

    margin-bottom:55px;

}



/* Inputs */

input{

    width:100%;

    height:47px;

    background:#121212;

    border:1px solid #3a3a3a;

    border-radius:6px;

    margin-bottom:14px;

    padding-left:13px;

    color:white;

    font-size:14px;

}


input::placeholder{

    color:#999;

}


/* senha */

.forgot{

    display:block;

    text-align:right;

    color:#4da3ff;

    font-size:13px;

    text-decoration:none;

    margin-top:-5px;

}



/* Botão */

.login-btn{

    width:100%;

    height:41px;

    margin-top:30px;

    border:none;

    border-radius:6px;

    background:#3797f0;

    color:white;

    font-weight:bold;

    cursor:pointer;

}



/* Separador */

.separator{

    display:flex;

    align-items:center;

    gap:15px;

    margin:35px 0;

    color:#777;

    font-size:12px;

}


.line{

    height:1px;

    background:#222;

    flex:1;

}



/* Facebook */

.facebook{

    color:#4d9fff;

    font-weight:bold;

    font-size:14px;

}



/* Rodapé */


.footer{

    position:fixed;

    bottom:0;

    width:100%;

    height:75px;

    border-top:1px solid #222;

    display:flex;

    justify-content:center;

    align-items:center;

    color:#aaa;

    font-size:13px;

}


.footer span{

    color:#4da3ff;

    font-weight:bold;

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
    MySite
</div>



<input placeholder="Email, usuário ou telefone">


<input type="password" placeholder="Senha">



<a class="forgot">
    Esqueceu a senha?
</a>



<button class="login-btn">
    Entrar
</button>



<div class="separator">

<div class="line"></div>

OU

<div class="line"></div>

</div>




<div class="facebook">

🔵 Entrar com conta externa

</div>


</div>



<div class="footer">

Não possui uma conta? 
<span>&nbsp;Criar conta</span>

</div>



</body>

</html>
