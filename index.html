<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="login-box">

    <h1 class="logo">Instagram</h1>

    <form>
        <input type="text" placeholder="Telefone, utilizador ou email" required>

        <div class="password-box">
            <input type="password" placeholder="Palavra-passe" required>
            <span class="eye">👁</span>
        </div>

        <a href="#" class="forgot">Esqueceu a palavra-passe?</a>

        <button type="submit">Entrar</button>
    </form>

    <div class="divider">
        <span></span>
        <p>OU</p>
        <span></span>
    </div>

    <a href="#" class="facebook">
        📘 Entrar com Facebook
    </a>

    <div class="signup">
        Não tem uma conta?
        <a href="#">Registar</a>
    </div>

</div>

</body>
</html>
