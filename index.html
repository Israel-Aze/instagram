<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instagram Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:
    radial-gradient(circle at 100% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);

}

.container{

    width:350px;

}

.card{

    background:#fff;

    border:1px solid #dbdbdb;

    padding:45px 40px 30px;

    text-align:center;

}

.logo{

    font-size:54px;

    font-family:cursive;

    color:#262626;

    margin-bottom:35px;

}

input{

    width:100%;

    height:38px;

    margin-bottom:8px;

    padding:10px;

    border:1px solid #dbdbdb;

    background:#fafafa;

    font-size:12px;

    outline:none;

}

input:focus{

    border-color:#a8a8a8;

}

button{

    width:100%;

    height:32px;

    border:none;

    border-radius:4px;

    background:#4CB5F9;

    color:#fff;

    font-weight:bold;

    margin-top:8px;

    cursor:pointer;

}

button:hover{

    background:#3797ef;

}

.separator{

    display:flex;

    align-items:center;

    margin:20px 0;

    color:#8e8e8e;

    font-size:13px;

    font-weight:bold;

}

.separator::before,
.separator::after{

    content:"";

    flex:1;

    height:1px;

    background:#dbdbdb;

}

.separator span{

    padding:0 18px;

}

.forgot{

    display:block;

    margin-top:18px;

    color:#00376b;

    text-decoration:none;

    font-size:12px;

}

.signup{

    background:#fff;

    border:1px solid #dbdbdb;

    text-align:center;

    margin-top:10px;

    padding:22px;

    font-size:14px;

    color:#262626;

}

.signup a{

    color:#0095f6;

    text-decoration:none;

    font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
Instagram
</div>

<input
type="text"
placeholder="Phone number, username, or email">

<input
type="password"
placeholder="Password">

<button>
Log In
</button>

<div class="separator">
<span>OR</span>
</div>

<a href="#" class="facebook">
Log in with Facebook
</a>

<a href="#" class="forgot">
Forgot password?
</a>

</div>

<div class="signup">

Don't have an account?
<a href="#">Sign up.</a>

</div>

</div>

</body>
</html>
